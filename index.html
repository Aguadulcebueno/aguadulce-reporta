
<!-- MASCOTAS Y CENTROS DE ACOPIO -->

<style>
.community-feature-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  margin-top:25px;
}

.community-feature{
  background:white;
  border:1px solid #e1eae2;
  border-radius:22px;
  padding:28px;
  box-shadow:0 12px 35px rgba(8,40,27,.06);
}

.community-feature-icon{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:#eaf5e9;
  font-size:30px;
}

.community-feature h3{
  font-size:25px;
  margin:18px 0 9px;
}

.community-feature p{
  color:#6d8074;
  font-size:13px;
  line-height:1.8;
}

.community-feature .btn{
  margin-top:12px;
}

.community-feature-note{
  margin-top:20px;
  padding:17px;
  background:#fff9e8;
  border:1px solid #e8d9ac;
  border-radius:12px;
  color:#715728;
  font-size:12px;
  line-height:1.8;
}

@media(max-width:650px){
  .community-feature-grid{
    grid-template-columns:1fr;
  }
}
</style>

<script>
(function(){
  "use strict";

  const PETS="Mascotas perdidas y encontradas";
  const ACOPIO="Centros de acopio";

  function changeCategories(){

    // Cambiar el nombre anterior
    const categorySelect=
      document.getElementById("category");

    if(categorySelect){
      for(const option of categorySelect.options){
        if(option.value==="Protección animal"){
          option.value=PETS;
          option.textContent="🐾 "+PETS;
        }
      }

      // Nueva categoría de centros de acopio
      if(
        !Array.from(categorySelect.options)
          .some(option=>option.value===ACOPIO)
      ){
        const option=document.createElement("option");
        option.value=ACOPIO;
        option.textContent="📦 "+ACOPIO;
        categorySelect.appendChild(option);
      }
    }

    // Adaptar la lista de categorías existente
    if(typeof CATEGORIES!=="undefined"){
      const index=CATEGORIES.indexOf("Protección animal");

      if(index!==-1){
        CATEGORIES[index]=PETS;
      }

      if(!CATEGORIES.includes(ACOPIO)){
        CATEGORIES.push(ACOPIO);
      }
    }

    // Adaptar los iconos existentes
    if(typeof ICONS!=="undefined"){
      ICONS[PETS]="🐾";
      ICONS[ACOPIO]="📦";
    }

    // Mostrar instrucciones especiales
    if(categorySelect){
      categorySelect.addEventListener("change",()=>{
        const description=
          document.getElementById("description");

        const area=
          document.getElementById("area");

        if(categorySelect.value===PETS){
          description.placeholder=
            "Indica si la mascota está perdida o fue encontrada. "+
            "Describe sus características, fecha y zona general. "+
            "No publiques direcciones particulares.";
          area.placeholder=
            "¿En qué comunidad se perdió o encontró?";
        }

        if(categorySelect.value===ACOPIO){
          description.placeholder=
            "Nombre del organizador o institución, "+
            "fecha, horario, artículos que reciben "+
            "y contacto público autorizado. "+
            "Adjunta el afiche del centro de acopio.";
          area.placeholder=
            "Lugar del centro de acopio y comunidad";
        }
      });
    }
  }

  function createCommunitySection(){
    const donationSection=
      document.getElementById("donaciones")||
      document.getElementById("acopio");

    if(!donationSection)return;

    const section=document.createElement("div");
    section.id="nuevos-avisos-comunitarios";

    section.innerHTML=`
      <div class="community-feature-grid">

        <article class="community-feature">
          <div class="community-feature-icon">🐾</div>
          <h3>Mascotas perdidas y encontradas</h3>
          <p>
            ¿Perdiste a tu mascota o encontraste una?
            Publica un aviso con fotografía, descripción
            y la comunidad donde fue vista.
          </p>
          <button type="button"
            class="btn btn-green"
            id="reportarMascota">
            🐾 PUBLICAR AVISO
          </button>
        </article>

        <article class="community-feature">
          <div class="community-feature-icon">📦</div>
          <h3>Publica tu centro de acopio</h3>
          <p>
            ¿Estás organizando una colecta?
            Comparte tu afiche, lugar, fecha,
            horario y los artículos que estarán recibiendo.
          </p>
          <button type="button"
            class="btn btn-green"
            id="reportarAcopio">
            📢 PUBLICAR CENTRO DE ACOPIO
          </button>
        </article>

      </div>

      <div class="community-feature-note">
        ⚠️ Todos los avisos serán revisados antes
        de publicarse. La publicación de un centro
        de acopio no significa que esté verificado
        por una autoridad.
      </div>
    `;

    donationSection.appendChild(section);

    function goToReport(category){
      const select=document.getElementById("category");
      const visibility=document.getElementById("visibility");

      if(select){
        select.value=category;
        select.dispatchEvent(
          new Event("change",{bubbles:true})
        );
      }

      if(visibility){
        visibility.value="public";
      }

      document.getElementById("enviar")
        ?.scrollIntoView({behavior:"smooth"});
    }

    document.getElementById("reportarMascota")
      .addEventListener("click",()=>{
        goToReport(PETS);
      });

    document.getElementById("reportarAcopio")
      .addEventListener("click",()=>{
        goToReport(ACOPIO);
      });
  }

  changeCategories();
  createCommunitySection();
})();
</script>

<!-- FIN MASCOTAS Y CENTROS DE ACOPIO -->
