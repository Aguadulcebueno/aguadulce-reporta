
<!-- COMPARTIR PUBLICACIONES INDIVIDUALES -->
<style>
.share-report-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:14px;
  padding:11px 15px;
  border:1px solid #cde5d1;
  border-radius:11px;
  background:#eaf6e9;
  color:#14583e;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.share-report-btn:hover{
  background:#d7f568;
}
.report-highlight{
  outline:3px solid #84b93b;
  outline-offset:4px;
  box-shadow:0 0 0 9px #d7f56850!important;
}
.share-menu{
  position:fixed;
  inset:0;
  z-index:999998;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#071f19c9;
}
.share-menu.active{display:flex}
.share-menu-content{
  width:min(420px,100%);
  background:white;
  padding:27px;
  border-radius:22px;
  box-shadow:0 25px 70px #0004;
}
.share-menu-content h3{
  margin:0 0 8px;
  font-size:26px;
}
.share-menu-content p{
  font-size:13px;
  line-height:1.7;
  color:#66796e;
}
.share-menu-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}
.share-menu-actions a,
.share-menu-actions button{
  display:block;
  padding:13px 9px;
  border:0;
  border-radius:11px;
  background:#eaf5e9;
  color:#14583e;
  text-align:center;
  font-size:12px;
  font-weight:900;
  text-decoration:none;
  cursor:pointer;
}
.share-menu-actions button:first-child{
  background:#14583e;
  color:white;
}
.share-menu-close{
  display:block;
  width:100%;
  margin-top:14px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#edf0ed;
  cursor:pointer;
  font-weight:800;
}
</style>

<div id="reportShareMenu"
  class="share-menu"
  role="dialog"
  aria-modal="true"
  aria-label="Compartir publicación">

  <div class="share-menu-content">
    <h3>📢 Comparte este reporte</h3>
    <p>
      Ayuda a que esta publicación llegue
      a más personas de Aguadulce.
    </p>

    <div class="share-menu-actions">
      <button type="button" id="shareWhatsApp">
        🟢 WhatsApp
      </button>

      <button type="button" id="shareFacebook">
        🔵 Facebook
      </button>

      <button type="button" id="shareTelegram">
        ✈️ Telegram
      </button>

      <button type="button" id="shareCopy">
        🔗 Copiar enlace
      </button>
    </div>

    <button type="button"
      class="share-menu-close"
      id="closeShareMenu">
      Cerrar
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const BASE_URL=
    "https://aguadulcebueno.github.io/aguadulce-reporta/";

  const containers=[
    "publicReports",
    "petsList",
    "acopioList"
  ];

  const shareMenu=
    document.getElementById("reportShareMenu");

  const targetId=new URLSearchParams(
    window.location.search
  ).get("reporte");

  let activeUrl="";
  let activeTitle="";
  let highlightDone=false;

  function reportUrl(id){
    const url=new URL(BASE_URL);
    url.searchParams.set("reporte",id);
    return url.toString();
  }

  function getReportId(card){
    const image=card.querySelector(
      ".report-photo-wrap img"
    );

    if(image){
      try{
        const url=new URL(image.src);
        const id=url.searchParams.get("id");

        if(id)return id;
      }catch(error){}
    }

    return card.dataset.reportId||"";
  }

  function getReportTitle(card){
    return card.querySelector("h3")
      ?.textContent?.trim()||
      "Publicación de Aguadulce Reporta";
  }

  function openShare(id,title){
    activeUrl=reportUrl(id);
    activeTitle=title;

    shareMenu.classList.add("active");
  }

  function closeShare(){
    shareMenu.classList.remove("active");
  }

  function openExternal(url){
    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }

  document.getElementById(
    "shareWhatsApp"
  ).onclick=()=>{
    const text=
      activeTitle+"\n\n"+activeUrl;

    openExternal(
      "https://api.whatsapp.com/send?text="+
      encodeURIComponent(text)
    );
  };

  document.getElementById(
    "shareFacebook"
  ).onclick=()=>{
    openExternal(
      "https://www.facebook.com/sharer/sharer.php?u="+
      encodeURIComponent(activeUrl)
    );
  };

  document.getElementById(
    "shareTelegram"
  ).onclick=()=>{
    openExternal(
      "https://t.me/share/url?url="+
      encodeURIComponent(activeUrl)+
      "&text="+encodeURIComponent(activeTitle)
    );
  };

  document.getElementById(
    "shareCopy"
  ).onclick=async()=>{
    try{
      await navigator.clipboard.writeText(
        activeUrl
      );

      const button=document.getElementById(
        "shareCopy"
      );

      button.textContent="✅ Copiado";

      setTimeout(()=>{
        button.textContent="🔗 Copiar enlace";
      },2000);

    }catch(error){
      window.prompt(
        "Copia el enlace:",
        activeUrl
      );
    }
  };

  document.getElementById(
    "closeShareMenu"
  ).onclick=closeShare;

  shareMenu.addEventListener(
    "click",event=>{
      if(event.target===shareMenu){
        closeShare();
      }
    }
  );

  document.addEventListener(
    "keydown",event=>{
      if(event.key==="Escape"){
        closeShare();
      }
    }
  );

  function decorateCards(){
    containers.forEach(containerId=>{
      const container=document.getElementById(
        containerId
      );

      if(!container)return;

      container.querySelectorAll(
        ".report-card"
      ).forEach(card=>{
        const id=getReportId(card);

        if(!id)return;

        card.dataset.reportId=id;

        if(!card.querySelector(
          ".share-report-btn"
        )){
          const button=document.createElement(
            "button"
          );

          button.type="button";
          button.className="share-report-btn";
          button.textContent="↗ Compartir publicación";

          button.addEventListener(
            "click",()=>{
              openShare(
                id,
                getReportTitle(card)
              );
            }
          );

          const body=card.querySelector(
            ".report-body"
          )||card;

          body.appendChild(button);
        }

        if(
          targetId===id &&
          !highlightDone
        ){
          highlightDone=true;

          card.classList.add(
            "report-highlight"
          );

          setTimeout(()=>{
            card.scrollIntoView({
              behavior:"smooth",
              block:"center"
            });
          },300);
        }
      });
    });
  }

  const observer=new MutationObserver(
    decorateCards
  );

  containers.forEach(id=>{
    const container=document.getElementById(id);

    if(container){
      observer.observe(container,{
        childList:true,
        subtree:true
      });
    }
  });

  decorateCards();
})();
</script>
<!-- FIN COMPARTIR PUBLICACIONES -->
